name: QAOps - Playwright, JMeter & Google AI

on:
  push:
    branches: [ "main" ]

jobs:
  playwright-ai-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          
      # Testes atuais são só API (fixture request): não instalar browsers poupa vários minutos.
      # Ver https://playwright.dev/docs/api-testing
      - name: Instalar dependências (sem browsers)
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          
      # REQRES_API_KEY: obrigatório — reqres.in exige x-api-key (https://app.reqres.in/api-keys).
      # GEMINI_API_KEY: opcional — sem ela os testes usam cenários fixos em vez da IA.
      - name: Executar Playwright + Gemini
        run: npx playwright test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

  jmeter-load-tests:
    runs-on: ubuntu-latest
    # Depois do Playwright: os dois usam a mesma REQRES_API_KEY — em paralelo gerava 429 no /api/register.
    needs: playwright-ai-tests
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar Apache JMeter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jmeter

      - name: Checar REQRES_API_KEY (obrigatório para JMeter)
        run: |
          if [ -z "${REQRES_API_KEY:-}" ]; then
            echo "::error::Defina o secret REQRES_API_KEY (https://app.reqres.in/api-keys)."
            exit 1
          fi
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

      # Carga menor no CI (threads/loops via -J); -JreqresApiKey alinha com Playwright (secret REQRES_API_KEY).
      - name: Executar Teste de Performance (JMeter em modo non-GUI)
        run: jmeter -n -t performance/load-test.jmx -l performance/results.jtl -Jthreads=5 -Jloops=2 -JreqresApiKey="${REQRES_API_KEY}"
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

      - name: Salvar Relatório de Performance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-results
          path: performance/results.jtl